<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GROWTHX 特洛伊賦能陪跑系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root { 
      --primary: #1d1d1f; --primary-hover: #434344;
      --accent: #0066cc; --accent-hover: #0077ed;
      --surface: #ffffff; --bg: #f5f5f7; --border: #d2d2d7;
      --text-main: #1d1d1f; --text-muted: #86868b;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --sidebar-width: 260px;
    }
    
    * { box-sizing: border-box; }
    html, body { max-width: 100vw; overflow-x: hidden; position: relative; }
    body { background-color: var(--bg); font-family: var(--font-family); margin: 0; padding: 0; color: var(--text-main); -webkit-font-smoothing: antialiased; }
    
    /* 懸浮 Toast 通知 */
    .toast-container { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 10000; display: flex; flex-direction: column; gap: 12px; pointer-events: none; width: 90%; max-width: 400px; align-items: center; }
    .custom-toast { background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: var(--text-main); padding: 14px 24px; border-radius: 999px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); border: 1px solid rgba(255,255,255,0.5); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; opacity: 0; transform: translateY(-20px) scale(0.95); transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); pointer-events: auto; }
    .custom-toast.show { opacity: 1; transform: translateY(0) scale(1); }
    .toast-error { background: rgba(255, 59, 48, 0.9); color: white; border: none; }
    .toast-success { background: rgba(52, 199, 89, 0.95); color: white; border: none; }

    /* 佈局架構 */
    .app-layout { display: flex; height: 100vh; overflow: hidden; flex-direction: row; }
    .sidebar { width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 32px 20px; z-index: 100; }
    .main-content { flex: 1; overflow-y: auto; padding: 40px; position: relative; scroll-behavior: smooth; }
    
    .brand-logo { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 12px; margin-bottom: 48px; padding-left: 12px; letter-spacing: -0.5px; color: var(--primary); text-transform: uppercase; }
    .nav-menu { list-style: none; padding: 0; margin: 0; flex: 1; }
    .nav-item { margin-bottom: 8px; }
    .nav-link { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 15px; transition: all 0.2s ease; cursor: pointer; }
    .nav-link:hover { background: rgba(0,0,0,0.04); color: var(--primary); }
    .nav-link.active { background: var(--primary); color: white; }
    
    .panel-view { display: none; max-width: 700px; margin: 0 auto; animation: fadeIn 0.4s ease; }
    .panel-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    
    .card-panel { background: var(--surface); border-radius: 24px; padding: 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.04); margin-bottom: 24px; border: 1px solid rgba(0,0,0,0.02); }
    .form-group-stack { display: flex; flex-direction: column; gap: 24px; margin-bottom: 24px; width: 100%; }
    .form-label { font-weight: 600; color: var(--primary); font-size: 14px; margin-bottom: 8px; }
    .form-control { border-radius: 12px; border: 1px solid var(--border); padding: 16px; background: var(--bg); font-size: 15px; width: 100%; }
    .form-control:focus { background: var(--surface); border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0,0,0,0.05); outline: none; }
    
    .btn-brand { background-color: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 600; padding: 16px; width: 100%; font-size: 15px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none; }
    .btn-brand:hover { background-color: var(--primary-hover); transform: translateY(-1px); color: white; }
    .btn-outline { background-color: transparent; color: var(--primary); border: 1px solid var(--border); border-radius: 12px; font-weight: 600; padding: 14px; width: 100%; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none; }

    .profile-stack { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; margin-bottom: 32px; padding-bottom: 32px; border-bottom: 1px solid var(--border); }
    .avatar-circle { width: 80px; height: 80px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 600; }
    .member-code-box { background: var(--bg); padding: 8px 16px; border-radius: 8px; font-family: monospace; font-size: 14px; cursor: pointer; border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); }
    .status-stack { width: 100%; background: var(--bg); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }

    .app-card { background: var(--bg); border-radius: 16px; padding: 24px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; width: 100%; }
    .gem-pro-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 32px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.02); transition: 0.3s; }
    .gem-pro-card:hover { border-color: var(--primary); box-shadow: 0 12px 32px rgba(0,0,0,0.06); transform: translateY(-2px); }
    .gem-icon-box { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--primary); align-self: flex-start; }
    
    .trigger-card { background: var(--primary); color: white; text-align: center; padding: 48px 20px; border-radius: 24px; cursor: pointer; transition: 0.3s; margin-bottom: 24px; border: none; }
    .trigger-card:hover { transform: translateY(-4px); background: var(--primary-hover); }
    .trigger-icon-wrapper { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.1); margin-bottom: 20px; }

    .video-container { position: relative; width: 100%; max-height: 480px; background: #000; border-radius: 20px; margin-bottom: 24px; overflow: hidden; display: none; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .status-badge { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); color: white; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 12px; display: none; align-items: center; gap: 8px; }
    .pulse-dot { width: 6px; height: 6px; background-color: #ff3b30; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } }
    
    .controls-overlay { position: absolute; background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); padding: 12px 24px; border-radius: 100px; display: flex; gap: 24px; align-items: center; z-index: 20; transition: 0.3s; }
    
    @media (min-width: 769px) or (orientation: landscape) {
      .controls-overlay { bottom: 24px; left: 50%; transform: translateX(-50%); flex-direction: row; }
      .mobile-header { display: none; }
      .mobile-overlay { display: none; }
    }
    @media (max-width: 768px) and (orientation: portrait) {
      .controls-overlay { right: 16px; top: 50%; transform: translateY(-50%); flex-direction: column; border-radius: 30px; padding: 24px 12px; }
    }

    .control-btn { background: none; border: none; color: white; cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; outline: none; }
    .control-btn:hover { background: rgba(255,255,255,0.2); }
    .log-box { height: 120px; overflow-y: auto; background: var(--primary); color: #4ade80; padding: 16px; border-radius: 16px; font-family: monospace; font-size: 13px; margin-bottom: 24px; width: 100%; }
    
    .post-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 32px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 24px; width: 100%; }
    .post-header { display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .details-content { padding: 16px; background: var(--bg); border-radius: 12px; font-size: 14px; line-height: 1.6; color: var(--text-muted); word-wrap: break-word; }
    details summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; color: var(--primary); outline: none; }
    details summary::-webkit-details-marker { display: none; }
    
    .comment-box { background: var(--bg); border-radius: 16px; padding: 16px; margin-top: 12px; border-left: 3px solid var(--primary); display: flex; flex-direction: column; gap: 6px; width: 100%; }

    .step-section { display: none; animation: fadeIn 0.4s ease; }
    .step-section.active { display: block; }

    /* 📱 手機版漢堡選單與側滑樣式 */
    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      
      .mobile-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 900; }
      .menu-toggle-btn { background: none; border: none; color: var(--primary); padding: 0; display: flex; align-items: center; cursor: pointer; }
      .brand-logo-mobile { font-size: 18px; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; margin: 0; }
      
      .sidebar { position: fixed; top: 0; left: -100%; width: 280px; height: 100vh; flex-direction: column; padding: 32px 20px; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 4px 0 24px rgba(0,0,0,0.1); border-right: none; z-index: 1001; justify-content: flex-start; }
      .sidebar.open { left: 0; }
      
      .brand-logo { display: flex; margin-bottom: 32px; }
      .nav-menu { display: block; width: 100%; }
      .nav-item { margin-bottom: 8px; }
      .nav-link { flex-direction: row; gap: 14px; padding: 12px 16px; font-size: 15px; background: transparent; }
      .nav-link.active { background: var(--primary); color: white; }
      .nav-footer { display: block; margin-top: auto; }
      
      .main-content { padding: 20px; flex: 1; overflow-y: auto; }
      
      .mobile-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s ease; }
      .mobile-overlay.open { opacity: 1; pointer-events: auto; }
    }

    /* 🔥 優化閱讀體驗與分頁專屬樣式 */
    .copy-btn { background: none; border: 1px solid var(--border); color: var(--text-muted); font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
    .copy-btn:hover { background: var(--surface); color: var(--primary); border-color: var(--primary); }
    
    .pagination-container { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 24px; padding-bottom: 24px; }
    .page-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; }
    .page-btn:hover:not(:disabled) { background: var(--bg); color: var(--primary); border-color: var(--primary); }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .iframe-video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; margin-top: 12px; background: #000; }
    .iframe-video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    /* 🔥 日誌收合外觀控制 */
    .post-toggle-details { width: 100%; }
    .post-header-summary { display: flex; justify-content: space-between; align-items: center; cursor: pointer; list-style: none; outline: none; user-select: none; transition: background 0.2s; border-radius: 12px; }
    .post-header-summary::-webkit-details-marker { display: none; }
    .post-toggle-details[open] .expand-icon { transform: rotate(180deg); }
    .expand-icon { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

    /* 🔥 逐字稿內部收合控制 */
    .transcript-details { margin-top: 16px; }
    .transcript-summary { display: flex; align-items: center; cursor: pointer; list-style: none; outline: none; padding: 14px 16px; background: rgba(0, 102, 204, 0.04); border-radius: 12px; transition: 0.2s; color: var(--accent); font-size: 15px; font-weight: 600; }
    .transcript-summary:hover { background: rgba(0, 102, 204, 0.08); }
    .transcript-summary::-webkit-details-marker { display: none; }
    
    /* 🔥 逐字稿自動排版防擠壓 (極致排版核心) */
    .transcript-box { 
      background: var(--bg); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      padding: 24px; 
      font-size: 15px; 
      line-height: 1.8; 
      color: #333; 
      max-height: 500px; 
      overflow-y: auto; 
      white-space: pre-wrap; 
      word-break: break-word; 
      font-family: var(--font-family);
    }

    /* 🔥 Vocus (方格子) 極致閱讀體驗樣式 */
    .vocus-style {
      font-family: "Noto Sans TC", "SF Pro Display", "SF Pro Text", sans-serif;
      font-size: 16px;
      line-height: 1.9;
      color: #2c2c2c;
      letter-spacing: 0.5px;
    }
    .vocus-style h1, .vocus-style h2, .vocus-style h3, .vocus-style h4, .vocus-style h5, .vocus-style h6 {
      font-weight: 700;
      color: #1a1a1a;
      margin-top: 1.6em;
      margin-bottom: 0.6em;
      line-height: 1.4;
    }
    .vocus-style strong {
      color: #111;
      background: linear-gradient(transparent 60%, rgba(0, 102, 204, 0.12) 40%);
    }
    .vocus-style p { margin-bottom: 1.4em; }
    .vocus-style ul, .vocus-style ol { margin-bottom: 1.4em; padding-left: 1.5em; }
    .vocus-style li { margin-bottom: 0.6em; }
  </style>
</head>
<body>

<div id="toast-container" class="toast-container"></div>

<div id="view-login" style="max-width: 400px; margin: 8vh auto; padding: 0 24px;">
  <div class="card-panel border-0 text-center">
    <div class="d-inline-flex justify-content-center align-items-center mb-4" style="background: var(--primary); color: white; padding: 16px; border-radius: 20px;">
      <i data-lucide="layers" style="width: 32px; height: 32px;"></i>
    </div>
    <h3 class="fw-bold mb-1" style="letter-spacing: -0.5px;">GROWTHX</h3>
    <p class="text-muted small fw-medium mb-4">特洛伊賦能陪跑系統</p>

    <div id="step-email" class="step-section active text-start">
      <div class="form-group-stack">
        <div>
          <label class="form-label">工作信箱</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@gmail.com">
        </div>
        <button class="btn-brand" onclick="checkEmail()" id="btnCheckEmail">下一步</button>
      </div>
    </div>

    <div id="step-register" class="step-section text-start">
      <div class="form-group-stack">
        <div>
          <label class="form-label">真實姓名</label>
          <input type="text" id="regName" class="form-control" placeholder="請輸入姓名">
        </div>
        <div>
          <label class="form-label text-danger">專屬 API KEY (必填)</label>
          <input type="password" id="regApiKey" class="form-control" placeholder="sk-xxxxxxxxxxxxxxxx">
          <div class="mt-2 text-end">
            <a href="https://aistudio.google.com/app/apikey" target="_blank" style="font-size: 12px; color: var(--accent); font-weight: 500; text-decoration: none;">
              前往申請 Google AI Studio 金鑰 <i data-lucide="external-link" style="width:12px; margin-left: 2px;"></i>
            </a>
          </div>
        </div>
        <button class="btn-brand" onclick="registerAccount()" id="btnRegister">註冊並發送驗證碼</button>
        <button class="btn-outline" onclick="switchLoginStep('step-email')">返回上一頁</button>
      </div>
    </div>

    <div id="step-code" class="step-section">
      <div class="text-center mb-4 text-muted" style="font-size:14px;">
        驗證碼已發送至 <br><strong id="displayTargetEmail" style="color: var(--primary);"></strong>
      </div>
      <div class="form-group-stack">
        <input type="text" id="loginCode" class="form-control text-center fw-bold" placeholder="輸入 6 位數字" style="letter-spacing: 8px; font-size: 24px;">
        <button class="btn-brand" onclick="verifyCode()" id="btnVerify">驗證登入</button>
        <button class="btn-outline" onclick="switchLoginStep('step-email')">重新填寫信箱</button>
      </div>
    </div>
  </div>
</div>

<div id="view-main" class="app-layout" style="display:none;">
  <div class="mobile-header">
    <button class="menu-toggle-btn" onclick="toggleMobileMenu()">
      <i data-lucide="menu"></i>
    </button>
    <div class="brand-logo-mobile">GROWTHX</div>
    <div style="width: 24px;"></div> 
  </div>
  
  <div id="mobileOverlay" class="mobile-overlay" onclick="toggleMobileMenu()"></div>

  <aside class="sidebar">
    <div class="brand-logo">
      <i data-lucide="layout-dashboard"></i> GROWTHX
    </div>
    <ul class="nav-menu">
      <li class="nav-item"><a class="nav-link active" onclick="switchTab('tab-member')" id="nav-tab-member"><i data-lucide="user"></i> <span>會員中心</span></a></li>
      <li class="nav-item"><a class="nav-link" onclick="switchTab('tab-gem')" id="nav-tab-gem"><i data-lucide="cpu"></i> <span>AI 助教</span></a></li>
      <li class="nav-item"><a class="nav-link" onclick="switchTab('tab-coach')" id="nav-tab-coach"><i data-lucide="video"></i> <span>陪跑日誌</span></a></li>
      <li class="nav-item"><a class="nav-link" onclick="switchTab('tab-school')" id="nav-tab-school"><i data-lucide="graduation-cap"></i> <span>FFS 學堂</span></a></li>
      <li class="nav-item"><a class="nav-link" onclick="switchTab('tab-blog')" id="nav-tab-blog"><i data-lucide="book-open"></i> <span>實戰部落格</span></a></li>
    </ul>
    <div class="nav-footer mt-auto">
      <button class="btn-outline w-100" style="border:none; background:var(--bg);" onclick="logout()"><i data-lucide="log-out" style="width:16px;"></i> 登出系統</button>
    </div>
  </aside>

  <main class="main-content">
    
    <div id="tab-member" class="panel-view active">
      <div class="card-panel">
        <div class="profile-stack">
          <div class="avatar-circle" id="userInitial">U</div>
          <h3 class="fw-bold m-0" id="profileNameDisplay" style="letter-spacing: -0.5px;">載入中...</h3>
          <p class="text-muted m-0" id="profileEmailDisplay">email@domain.com</p>
          <div class="member-code-box" onclick="copyCode()" title="點擊複製"><i data-lucide="copy" style="width:14px;"></i> <span id="memberCodeTxt">CODE</span></div>
          
          <div class="status-stack mt-2">
            <div style="font-size:13px; color:var(--text-muted);">身份：<span id="roleTxt" class="fw-bold text-primary"></span></div>
            <div style="font-size:13px; color:var(--text-muted);">註冊日：<span id="regDateTxt"></span></div>
            <div class="fw-bold" style="font-size: 15px;">到期日：<span id="expiryDateTxt"></span></div>
          </div>
        </div>
      </div>
    </div>

    <div id="tab-gem" class="panel-view">
      <div class="mb-5 text-center text-md-start">
        <h2 class="fw-bold mb-2" style="letter-spacing: -1px;">GROWTHX 數位轉型</h2>
        <h5 class="text-muted fw-normal mb-4">四神組合拳大眾落地指南</h5>
      </div>
      <div id="gemContainer" class="form-group-stack"></div>
    </div>

    <div id="tab-coach" class="panel-view">
      <div class="mb-4"><h4 class="fw-bold m-0" style="letter-spacing: -0.5px;">歷史日誌總帳</h4></div>
      <div id="feedContainer"></div>
    </div>

    <div id="tab-school" class="panel-view">
      <div class="mb-4">
        <h2 class="fw-bold mb-1">FFS 學堂</h2>
        <p class="text-muted small">教練專屬影音發布與全體學員互動大本營</p>
      </div>
      <div id="schoolFeedContainer" class="form-group-stack"></div>
    </div>
    
    <div id="tab-blog" class="panel-view" style="max-width: 100%;">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 class="fw-bold mb-1">實戰部落格</h2>
          <p class="text-muted small">GROWTHX 方格子專欄與實戰紀錄</p>
        </div>
      </div>
      <div class="card-panel p-0" style="height: calc(100vh - 180px); min-height: 800px; overflow: hidden; border-radius: 24px; position: relative;">
        <iframe id="blogIframe" src="https://vocus.cc/salon/bizgrowthxai" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;"></iframe>
      </div>
    </div>

  </main>
</div>

<script>
  // 💡 【GitHub 雙棲部署】：如果您將檔案放在 Github Pages，請將下方網址換成您 GAS 部署的 Web App URL
  const GAS_WEBAPP_URL = "在此貼上您後端GAS部署的網址"; 
  const isGAS = typeof google !== 'undefined' && google.script;

  let currentUser = null;

  // 🌟 將初始化與綁定邏輯包裝在 DOMContentLoaded 中，抵禦擴充功能干擾！
  document.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    
    try {
      currentUser = JSON.parse(localStorage.getItem('gx_saas_user') || 'null');
    } catch(e) { console.warn("LocalStorage 解析失敗"); }

    renderGemMatrix();

    if (currentUser && currentUser.email) {
      document.getElementById('view-login').style.display = 'none';
      document.getElementById('view-main').style.display = 'flex';
      loadDashboard();
    }
  });

  // --- 💡 渲染解耦：獨立繪製靜態 GEM 助教選單 ---
  function renderGemMatrix() {
    const gems = [
      { name: "GEM 1：系統許願機", subtitle: "抓漏老闆大腦的戰略軍師", intro: "專門幫你把大腦裡「好想做個自動化系統」的模糊願景，翻譯成真正能幫公司省時間、賺大錢的「黃金賺錢計畫」。", url: "#" },
      { name: "GEM 2：工作流水線拆解器", subtitle: "抓出隱形吸血鬼的營運專家", intro: "把你和員工每天重複的動作，像工廠傳送帶一樣切碎檢查。", url: "#" }
    ];
    document.getElementById('gemContainer').innerHTML = gems.map(g => `
      <div class="gem-pro-card">
        <h4 class="fw-bold m-0 text-primary">${g.name}</h4>
        <p class="text-muted small">${g.intro}</p>
      </div>
    `).join('');
  }

  function showToast(message, type = 'error') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `custom-toast toast-${type}`;
    const icon = type === 'success' ? 'check-circle' : 'alert-circle';
    toast.innerHTML = `<i data-lucide="${icon}" style="width:18px;"></i><span>${message}</span>`;
    container.appendChild(toast);
    lucide.createIcons();
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
  }

  // 統一 API 呼叫引擎
  async function api(payload) {
    if (isGAS) {
      return new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resStr => {
          try {
            const res = JSON.parse(resStr);
            if(res.status === 'success') resolve(res.data); else reject(new Error(res.message));
          } catch(e) { reject(new Error("系統資料格式異常")); }
        }).withFailureHandler(err => reject(err)).processFrontendApi(JSON.stringify(payload));
      });
    } else {
      if(GAS_WEBAPP_URL === "在此貼上您後端GAS部署的網址" || !GAS_WEBAPP_URL) {
         throw new Error("請先在前端程式碼設定您的 GAS_WEBAPP_URL！");
      }
      const response = await fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
      const res = await response.json();
      if(res.status === 'success') return res.data; else throw new Error(res.message);
    }
  }

  // 登入流程控制
  async function checkEmail() {
    const email = document.getElementById('loginEmail').value;
    if(!email) return showToast("請輸入信箱", "warning");
    try {
      const res = await api({ action: "checkEmail", email });
      if (res.isRegistered) { switchLoginStep('step-code'); } else { switchLoginStep('step-register'); }
    } catch(e) { showToast(e.message, "error"); }
  }

  async function verifyCode() {
    const email = document.getElementById('loginEmail').value;
    try {
      const data = await api({ action: "verifyCode", email, code: "123456" });
      localStorage.setItem('gx_saas_user', JSON.stringify(data)); 
      location.reload();
    } catch(e) { showToast(e.message, "error"); }
  }

  function switchLoginStep(stepId) { 
    document.querySelectorAll('.step-section').forEach(el => el.classList.remove('active')); 
    document.getElementById(stepId).classList.add('active'); 
  }
  
  function switchTab(tabId) { 
    document.querySelectorAll('.panel-view').forEach(el => el.classList.remove('active')); 
    document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active')); 
    document.getElementById(tabId).classList.add('active'); 
    document.getElementById('nav-' + tabId).classList.add('active'); 
    document.querySelector('.sidebar').classList.remove('open');
    document.getElementById('mobileOverlay').classList.remove('open');
  }

  function toggleMobileMenu() {
    document.querySelector('.sidebar').classList.toggle('open');
    document.getElementById('mobileOverlay').classList.toggle('open');
  }

  function logout() { localStorage.removeItem('gx_saas_user'); location.reload(); }

  async function loadDashboard() {
    try {
      const data = await api({ action: "getDashboardData", email: currentUser.email });
      document.getElementById('profileEmailDisplay').innerText = data.profile.email;
      document.getElementById('profileNameDisplay').innerText = data.profile.name;
      document.getElementById('roleTxt').innerText = data.profile.role;
      document.getElementById('userInitial').innerText = data.profile.name.charAt(0).toUpperCase();
    } catch(e) { showToast("儀表板載入異常", "warning"); }
  }
</script>
</body>
</html>
