<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GROWTHX 特洛伊賦能陪跑系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root { 
      --primary: #1d1d1f; --primary-hover: #434344;
      --accent: #0066cc; --accent-hover: #0077ed;
      --surface: #ffffff; --bg: #f5f5f7; --border: #d2d2d7;
      --text-main: #1d1d1f; --text-muted: #86868b;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --sidebar-width: 260px;
      --vctable: #b4d455; 
    }
    
    * { box-sizing: border-box; }
    html, body { max-width: 100vw; overflow-x: hidden; position: relative; height: 100%; }
    body { background-color: var(--bg); font-family: var(--font-family); margin: 0; padding: 0; color: var(--text-main); -webkit-font-smoothing: antialiased; }
    
    /* Toast System */
    .toast-container { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 10000; display: flex; flex-direction: column; gap: 12px; pointer-events: none; width: 90%; max-width: 400px; align-items: center; }
    .custom-toast { background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: var(--text-main); padding: 14px 24px; border-radius: 999px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); border: 1px solid rgba(255,255,255,0.5); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; opacity: 0; transform: translateY(-20px) scale(0.95); transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); pointer-events: auto; }
    .custom-toast.show { opacity: 1; transform: translateY(0) scale(1); }
    .toast-error { background: rgba(255, 59, 48, 0.95) !important; color: white !important; border: none !important; }
    .toast-success { background: rgba(52, 199, 89, 0.95) !important; color: white !important; border: none !important; }
    .toast-warning { background: rgba(255, 149, 0, 0.95) !important; color: white !important; border: none !important; }

    /* Layout & Sidebar */
    .app-layout { display: flex; height: 100vh; overflow: hidden; flex-direction: row; }
    .sidebar { width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 32px 20px; z-index: 100; }
    .main-content { flex: 1; overflow-y: auto; padding: 40px; position: relative; scroll-behavior: smooth; }
    
    .brand-logo { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 12px; margin-bottom: 48px; padding-left: 12px; letter-spacing: -0.5px; color: var(--primary); text-transform: uppercase; }
    .nav-menu { list-style: none; padding: 0; margin: 0; flex: 1; }
    .nav-item { margin-bottom: 8px; }
    .nav-link { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 15px; transition: all 0.2s ease; cursor: pointer; }
    .nav-link:hover { background: rgba(0,0,0,0.04); color: var(--primary); }
    .nav-link.active { background: var(--primary); color: white; }
    
    .panel-view { display: none; max-width: 700px; margin: 0 auto; animation: fadeIn 0.4s ease; }
    .panel-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Form & Buttons */
    .card-panel { background: var(--surface); border-radius: 24px; padding: 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.04); margin-bottom: 24px; border: 1px solid rgba(0,0,0,0.02); }
    .form-group-stack { display: flex; flex-direction: column; gap: 24px; margin-bottom: 24px; width: 100%; }
    .form-label { font-weight: 600; color: var(--primary); font-size: 14px; margin-bottom: 8px; }
    .form-control { border-radius: 12px; border: 1px solid var(--border); padding: 16px; background: var(--bg); font-size: 15px; width: 100%; }
    .form-control:focus { background: var(--surface); border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0,0,0,0.05); outline: none; }
    
    .btn-brand { background-color: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 600; padding: 16px; width: 100%; font-size: 15px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
    .btn-brand:hover { background-color: var(--primary-hover); transform: translateY(-1px); color: white; }
    .btn-outline { background-color: transparent; color: var(--primary); border: 1px solid var(--border); border-radius: 12px; font-weight: 600; padding: 14px; width: 100%; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
    .btn-outline:hover { background: var(--bg); border-color: var(--primary); }

    /* Video UI Engine */
    .trigger-card { background: var(--primary); color: white; text-align: center; padding: 48px 20px; border-radius: 24px; cursor: pointer; transition: 0.3s; margin-bottom: 24px; border: none; }
    .trigger-card:hover { transform: translateY(-4px); background: var(--primary-hover); }
    .trigger-icon-wrapper { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.1); margin-bottom: 20px; }

    .video-container { position: relative; width: 100%; max-height: 480px; background: #000; border-radius: 20px; margin-bottom: 24px; overflow: hidden; display: none; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .status-badge { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); color: white; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 12px; display: none; align-items: center; gap: 8px; }
    .pulse-dot { width: 6px; height: 6px; background-color: #ff3b30; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } }
    
    .controls-overlay { position: absolute; background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); padding: 12px 24px; border-radius: 100px; display: flex; gap: 24px; align-items: center; z-index: 20; transition: 0.3s; bottom: 24px; left: 50%; transform: translateX(-50%); }
    .control-btn { background: none; border: none; color: white; cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; outline: none; }
    .control-btn:hover { background: rgba(255,255,255,0.2); }

    /* Feed & Post Styles */
    .post-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 32px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 24px; width: 100%; position: relative; }
    .post-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    
    /* 🎬 Apple Style Video Carousel */
    .video-carousel-container { position: relative; width: 100%; border-radius: 16px; overflow: hidden; background: #000; min-height: 240px; }
    .carousel-item { display: none; width: 100%; height: 100%; }
    .carousel-item.active { display: block; animation: fadeIn 0.3s; }
    .carousel-iframe { width: 100%; aspect-ratio: 16/9; border: none; display: block; }
    .carousel-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.25); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; z-index: 10; opacity: 0.8; }
    .carousel-nav-btn:hover { background: rgba(255,255,255,0.4); opacity: 1; transform: translateY(-50%) scale(1.05); }
    .carousel-prev { left: 16px; }
    .carousel-next { right: 16px; }
    .carousel-indicator { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; letter-spacing: 1px; }

    /* Manager Dropdown */
    .manager-menu-container { position: absolute; right: 32px; top: 32px; }
    .manager-dropdown { position: absolute; right: 0; top: 40px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); display: none; flex-direction: column; overflow: hidden; z-index: 50; width: 140px; }
    .manager-dropdown.show { display: flex; animation: fadeIn 0.2s ease; }
    .manager-dropdown button { background: none; border: none; padding: 12px 16px; text-align: left; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--primary); transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .manager-dropdown button:hover { background: var(--bg); }
    .manager-dropdown button.text-danger { color: #ff3b30; border-top: 1px solid var(--border); }

    /* Modal Overlay */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.active { display: flex; animation: fadeIn 0.3s ease; }
    .modal-content { background: var(--surface); border-radius: 24px; padding: 32px; width: 100%; max-width: 480px; box-shadow: 0 24px 48px rgba(0,0,0,0.2); position: relative; }

    /* Responsive */
    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      .mobile-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 900; }
      .sidebar { position: fixed; top: 0; left: -100%; width: 280px; height: 100vh; transition: 0.3s; z-index: 1001; }
      .sidebar.open { left: 0; }
      .main-content { padding: 20px; }
    }
  </style>
</head>
<body>

<div id="toast-container" class="toast-container"></div>

<div id="view-login" style="max-width: 400px; margin: 8vh auto; padding: 0 24px;">
  <div class="card-panel border-0 text-center">
    <div class="d-inline-flex justify-content-center align-items-center mb-4" style="background: var(--primary); color: white; padding: 16px; border-radius: 20px;"><i data-lucide="layers" style="width: 32px; height: 32px;"></i></div>
    <h3 class="fw-bold mb-1">GROWTHX</h3><p class="text-muted small fw-medium mb-4">特洛伊賦能陪跑系統</p>
    <div id="step-email" class="step-section active text-start">
      <div class="form-group-stack">
        <div><label class="form-label">工作信箱</label><input type="email" id="loginEmail" class="form-control" placeholder="name@gmail.com"></div>
        <button class="btn-brand" onclick="checkEmail()" id="btnCheckEmail">下一步</button>
      </div>
    </div>
    <!-- 為了不干擾介面，這裡保持與您原本一樣的簡略 UI -->
  </div>
</div>

<div id="view-main" class="app-layout" style="display:none;">
  <aside class="sidebar">
    <div class="brand-logo"><i data-lucide="layout-dashboard"></i> GROWTHX</div>
    <ul class="nav-menu">
      <li class="nav-item"><a class="nav-link active" onclick="switchTab('tab-coach')" id="nav-tab-coach"><i data-lucide="video"></i> <span>陪跑日誌</span></a></li>
      <li class="nav-item"><a class="nav-link" onclick="switchTab('tab-school')" id="nav-tab-school"><i data-lucide="graduation-cap"></i> <span>FFS 學堂</span></a></li>
    </ul>
    <div class="nav-footer mt-auto"><button class="btn-outline w-100 border-0 bg-transparent" onclick="logout()"><i data-lucide="log-out" style="width:16px;"></i> 登出系統</button></div>
  </aside>

  <main class="main-content">
    
    <!-- 專注於 FFS 學堂 -->
    <div id="tab-school" class="panel-view">
      <div class="mb-4">
        <h2 class="fw-bold mb-1">FFS 學堂</h2>
        <p class="text-muted small">教練專屬影音發布與全體學員互動大本營</p>
      </div>

      <div id="coachPublishArea" class="card-panel" style="display:none;">
        <h5 class="fw-bold mb-3">發布全新學堂教材影音</h5>
        <div id="triggerSchoolRecordBox" class="trigger-card" onclick="toggleRecordUI('school')">
          <div class="trigger-icon-wrapper"><i data-lucide="video" style="width:24px; color:white;"></i></div><h6 class="m-0">開啟學堂 1080p 教材錄影機</h6>
        </div>
        <div id="schoolRecordUI" style="display:none;">
          <div class="video-container" id="videoContainerSchool" style="display:block;">
            <div id="recBadgeSchool" class="status-badge"><div class="pulse-dot"></div><span>錄製中</span></div>
            <video id="mediaPlayerSchool" autoplay muted playsinline></video>
            <div class="controls-overlay" id="playerControlsSchool" style="display:none;">
               <button class="control-btn stop-btn" id="btnStopSchool" onclick="stopMeeting()"><i data-lucide="square" style="color: #ff3b30;"></i></button>
            </div>
          </div>
          <button class="btn-brand mb-4" id="btnStartPostSchool" onclick="startPost()"><i data-lucide="play-circle" style="width:18px;"></i> 啟動系統錄製</button>
        </div>
        <div class="form-group-stack mt-3">
          <textarea id="schoolPostContent" class="form-control" rows="3" placeholder="請輸入本次影音教學的核心觀念或白話解說..."></textarea>
          <button class="btn-brand" id="btnPublishSchool" onclick="publishSchoolPost()">確定發布 (啟用背景 AI 結構萃取)</button>
        </div>
      </div>

      <div id="schoolFeedContainer" class="form-group-stack mt-4"></div>
    </div>
  </main>
</div>

<!-- Modal 編輯 -->
<div id="editModal" class="modal-overlay">
  <div class="modal-content">
    <h5 class="fw-bold mb-3">編輯教材描述</h5>
    <input type="hidden" id="editRowId">
    <textarea id="editContentArea" class="form-control mb-4" rows="4"></textarea>
    <div class="d-flex gap-3">
      <button class="btn-outline border-0 text-muted" onclick="closeModals()">取消</button>
      <button class="btn-brand" onclick="saveEditPost()">儲存變更</button>
    </div>
  </div>
</div>

<script>
  lucide.createIcons();
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwsUOjvkHIbKnR98-0AnYNhIbrz6xAp6parL7WgKCy4oU4P9uvNjZxxfOsesUZvDV_E/exec"; 
  const isGAS = typeof google !== 'undefined' && google.script;
  let currentUser = JSON.parse(localStorage.getItem('gx_saas_user') || 'null');
  
  let currentStream = null, mediaRecorder = null, isRecording = false, chunkInterval, chunkIndex = 1, postData = {};
  let currentRecordContext = "school"; 
  let activeProcessingTasks = new Set();
  
  // Carousel State Management
  let carouselStates = {};

  async function api(payload) {
    if (isGAS) {
      return new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resStr => {
          try { const res = JSON.parse(resStr); if(res.status === 'success') resolve(res.data); else reject(new Error(res.message)); } catch(e) { reject(new Error("系統資料格式異常")); }
        }).withFailureHandler(err => reject(err)).processFrontendApi(JSON.stringify(payload));
      });
    } else {
      const response = await fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
      const res = await response.json();
      if(res.status === 'success') return res.data; else throw new Error(res.message);
    }
  }

  function showToast(message, type = 'error') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div'); toast.className = `custom-toast toast-${type}`;
    const icon = type === 'success' ? 'check-circle' : (type === 'warning' ? 'alert-triangle' : 'alert-circle');
    toast.innerHTML = `<i data-lucide="${icon}" style="width:18px;"></i><span>${message}</span>`;
    container.appendChild(toast); lucide.createIcons();
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 4000);
  }

  if (currentUser && currentUser.email) {
    document.getElementById('view-login').style.display = 'none';
    document.getElementById('view-main').style.display = 'flex';
    if(currentUser.email === "alwayslucky2hand@gmail.com") { document.getElementById('coachPublishArea').style.display = 'block'; }
    loadDashboard();
  }

  async function loadDashboard() {
    try {
      const data = await api({ action: "getDashboardData", email: currentUser.email, role: currentUser.role });
      renderSchoolFeed(data.schoolFeed || []); 
    } catch(e) {}
  }

  // --- 🎬 影音錄製引擎 ---
  async function toggleRecordUI(context) {
    currentRecordContext = context;
    document.getElementById('triggerSchoolRecordBox').style.display = 'none';
    document.getElementById('schoolRecordUI').style.display = 'block';
    const audioConstraints = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
    try {
      currentStream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: audioConstraints });
      document.getElementById('mediaPlayerSchool').srcObject = currentStream;
    } catch(err) { showToast("硬體授權失敗", "error"); }
  }

  async function startPost() {
    const btn = document.getElementById('btnStartPostSchool'); btn.disabled = true; btn.innerHTML = '連線大腦中...';
    try {
      postData = await api({ action: "initSchoolPost", email: currentUser.email });
      isRecording = true; chunkIndex = 1;
      document.getElementById('recBadgeSchool').style.display = 'flex'; 
      document.getElementById('playerControlsSchool').style.display = 'flex';
      btn.style.display = 'none';
      startChunkRecording();
    } catch(e) { showToast("引擎初始化失敗", "error"); btn.disabled = false; }
  }

  function startChunkRecording() {
    if (!isRecording || !currentStream) return;
    let chunks = []; const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
    mediaRecorder = new MediaRecorder(currentStream, {mimeType: mime, videoBitsPerSecond: 2500000});
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = () => { if (chunks.length > 0) processChunk(new Blob(chunks, {type: mime}), mime, chunkIndex++); if (isRecording) startChunkRecording(); };
    mediaRecorder.start(); chunkInterval = setTimeout(() => { if (mediaRecorder.state === "recording") mediaRecorder.stop(); }, 60000);
  }

  function processChunk(blob, mime, cIndex) {
    const task = new Promise(resolve => {
      const reader = new FileReader(); reader.readAsDataURL(blob);
      reader.onloadend = async () => {
        const b64 = reader.result.split(',')[1];
        try {
          await api({ action: "saveDrive", base64Data: b64, mimeType: mime, folderId: postData.folderId, rowIndex: postData.rowIndex, chunkIndex: cIndex, sheetName: 'school' });
        } catch(e) {}
        resolve();
      };
    });
    activeProcessingTasks.add(task); task.then(() => activeProcessingTasks.delete(task));
  }

  async function stopMeeting() {
    isRecording = false; clearTimeout(chunkInterval);
    if(mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
    document.getElementById('recBadgeSchool').style.display = 'none'; document.getElementById('playerControlsSchool').style.display = 'none';
    if(currentStream) currentStream.getTracks().forEach(t => t.stop());
    while(activeProcessingTasks.size > 0) { await Promise.all(Array.from(activeProcessingTasks)); }
    showToast("所有 1080p 影音切片入庫完成，請輸入描述並發布。", "success");
  }

  async function publishSchoolPost() {
    const text = document.getElementById('schoolPostContent').value.trim();
    if(!text) return showToast("請先輸入影音教材解說內文", "warning");
    const btn = document.getElementById('btnPublishSchool'); btn.disabled = true; btn.innerText = "背景 AI 喚醒中...";
    try {
      const msg = await api({ action: "finalizeSchoolPost", rowIndex: postData.rowIndex, email: currentUser.email, content: text });
      showToast(msg, "success");
      setTimeout(() => location.reload(), 2000);
    } catch(e) { showToast(e.message, "error"); btn.disabled = false; }
  }

  // --- 🎨 前端輪播與列表渲染 ---
  function renderSchoolFeed(items) {
    const container = document.getElementById('schoolFeedContainer');
    const posts = items.filter(i => i.Type === "POST"); 
    const comments = items.filter(i => i.Type === "COMMENT");
    if (posts.length === 0) { container.innerHTML = '<div class="text-muted text-center p-5">學堂牆上目前空空如也。</div>'; return; }
    
    container.innerHTML = posts.map(post => {
      const myComments = comments.filter(c => c.ParentID === post.PostID);
      const commentsHtml = myComments.map(c => `<div class="p-3 bg-light rounded mb-2 small"><div class="d-flex justify-content-between fw-bold mb-1"><span>代碼：${c.AuthorCode}</span><span class="text-muted">${c.Timestamp}</span></div><div class="text-secondary">${c.Content}</div></div>`).join('');
      
      // Carousel Engine
      let carouselHtml = '';
      if (post.VideoURLs) {
        const urls = post.VideoURLs.split(',').filter(u => u.trim());
        if(urls.length > 0) {
          carouselStates[post.PostID] = { current: 0, total: urls.length };
          let slides = urls.map((url, idx) => {
             let fileIdMatch = url.match(/[-\w]{25,}/);
             let src = fileIdMatch ? `https://drive.google.com/file/d/${fileIdMatch[0]}/preview` : url;
             return `<div class="carousel-item ${idx===0?'active':''}" id="slide_${post.PostID}_${idx}"><iframe class="carousel-iframe" src="${src}" allow="autoplay; fullscreen"></iframe></div>`;
          }).join('');
          
          let navBtns = urls.length > 1 ? `
            <button class="carousel-nav-btn carousel-prev" onclick="moveCarousel('${post.PostID}', -1)"><i data-lucide="chevron-left"></i></button>
            <button class="carousel-nav-btn carousel-next" onclick="moveCarousel('${post.PostID}', 1)"><i data-lucide="chevron-right"></i></button>
            <div class="carousel-indicator" id="indicator_${post.PostID}">切片 1 / ${urls.length}</div>
          ` : '';

          carouselHtml = `<div class="video-carousel-container mb-4" id="carousel_${post.PostID}">${slides}${navBtns}</div>`;
        }
      }

      // Manager Controls
      let managerMenu = '';
      if (currentUser.email === 'alwayslucky2hand@gmail.com') {
        managerMenu = `
          <div class="manager-menu-container">
            <button class="btn-outline border-0 p-2 text-muted" onclick="toggleMenu('${post.PostID}')"><i data-lucide="more-vertical" style="width:20px;"></i></button>
            <div id="menu_${post.PostID}" class="manager-dropdown">
               <button onclick="openEditModal('${post.rowIndex}', \`${post.Content.replace(/`/g, "'")}\`)"><i data-lucide="edit-2" style="width:14px;"></i> 編輯描述</button>
               <button onclick="executeDelete('${post.rowIndex}')" class="text-danger"><i data-lucide="trash-2" style="width:14px;"></i> 刪除課程</button>
            </div>
          </div>
        `;
      }

      // Status Badge
      let statusHtml = post.Status === 'AI處理中' ? `<span class="badge bg-warning text-dark"><i data-lucide="loader" class="spin" style="width:12px; margin-right:4px;"></i>AI 背景結構萃取中</span>` : `<span class="badge bg-success"><i data-lucide="check" style="width:12px; margin-right:4px;"></i>大師級結構已萃取</span>`;

      return `
      <div class="post-card">
        ${managerMenu}
        <div class="post-header border-0 pb-0">
          <div><h5 class="fw-bold m-0 text-primary">教練實戰教材</h5><p class="small text-muted m-0 mt-1">${post.Timestamp} · ${statusHtml}</p></div>
        </div>
        <p class="fw-medium text-main m-0 px-2" style="font-size: 15px; line-height:1.6;">${post.Content}</p>
        
        ${carouselHtml}
        
        <div class="p-4 rounded" style="background: var(--bg); font-size:14px; border-left:4px solid var(--primary);">
           ${post.Status === 'AI處理中' ? '<div class="text-center text-muted py-4">AI 正在背景解析影片中，您可以先離開，稍後回來刷新查看完美筆記。</div>' : `<div style="line-height:1.8;">${marked.parse(post.AI_Summary || '尚無大綱')}</div>`}
        </div>

        <details>
           <summary class="small fw-bold text-accent" style="cursor:pointer; outline:none; display:flex; align-items:center; gap:6px;"><i data-lucide="align-left" style="width:14px;"></i> 查看原始每分鐘逐字稿</summary>
           <div class="mt-3 p-3 bg-white border rounded small text-muted" style="white-space:pre-wrap; max-height:300px; overflow-y:auto; line-height:1.6;">${post.Transcript || '解析中...'}</div>
        </details>
        
        <div class="mt-4 pt-4 border-top">
          <h6 class="fw-bold mb-3 small text-muted"><i data-lucide="message-square" style="width:14px;"></i> 學員互動區 (${myComments.length})</h6>
          ${commentsHtml}
          <div class="d-flex gap-2 mt-3">
            <input type="text" id="comment_input_${post.PostID}" class="form-control" style="padding:12px;" placeholder="輸入您的提問或心得...">
            <button class="btn-brand w-auto px-4" onclick="submitComment('${post.PostID}')">送出</button>
          </div>
        </div>
      </div>`;
    }).join('');
    lucide.createIcons();
  }

  function moveCarousel(postId, dir) {
    let state = carouselStates[postId];
    document.getElementById(`slide_${postId}_${state.current}`).classList.remove('active');
    state.current += dir;
    if(state.current < 0) state.current = state.total - 1;
    if(state.current >= state.total) state.current = 0;
    document.getElementById(`slide_${postId}_${state.current}`).classList.add('active');
    document.getElementById(`indicator_${postId}`).innerText = `切片 ${state.current + 1} / ${state.total}`;
  }

  // --- 教練管理功能 ---
  function toggleMenu(postId) {
    const menu = document.getElementById(`menu_${postId}`);
    menu.classList.toggle('show');
  }

  function openEditModal(rowIndex, currentContent) {
    document.getElementById('editRowId').value = rowIndex;
    document.getElementById('editContentArea').value = currentContent;
    document.getElementById('editModal').classList.add('active');
    document.querySelectorAll('.manager-dropdown').forEach(el => el.classList.remove('show'));
  }

  function closeModals() { document.getElementById('editModal').classList.remove('active'); }

  async function saveEditPost() {
    const rowId = document.getElementById('editRowId').value;
    const newContent = document.getElementById('editContentArea').value;
    try {
      await api({ action: "editSchoolPost", rowIndex: rowId, email: currentUser.email, newContent: newContent });
      showToast("更新成功", "success"); closeModals(); loadDashboard();
    } catch(e) { showToast("更新失敗", "error"); }
  }

  async function executeDelete(rowIndex) {
    if(confirm("確定要將這堂課程從系統徹底刪除嗎？")) {
      try {
        await api({ action: "deleteSchoolPost", rowIndex: rowIndex, email: currentUser.email });
        showToast("刪除成功", "success"); loadDashboard();
      } catch(e) { showToast("刪除失敗", "error"); }
    }
  }

  async function submitComment(postId) {
    const input = document.getElementById(`comment_input_${postId}`);
    if (!input.value.trim()) return showToast("內文不可為空", "warning");
    try {
      await api({ action: "addSchoolComment", email: currentUser.email, parentId: postId, content: input.value.trim() });
      showToast("互動留言成功！", "success"); loadDashboard();
    } catch(e) { showToast("留言失敗", "error"); }
  }

  function switchTab(tabId) { 
    document.querySelectorAll('.panel-view').forEach(el => el.classList.remove('active')); 
    document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active')); 
    document.getElementById(tabId).classList.add('active'); 
    document.getElementById('nav-' + tabId).classList.add('active'); 
  }
  function logout() { localStorage.removeItem('gx_saas_user'); location.reload(); }
</script>
</body>
</html>
